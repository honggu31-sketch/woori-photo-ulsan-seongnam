<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>갤러리 | 우리동네사진관 울산성남점</title>
  <meta name="description" content="우리동네사진관 울산성남점에서 촬영한 가족사진, 증명사진, 프로필사진 갤러리.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="gallery">
  <header id="site-header"></header>

  <main>
    <section class="section" style="padding-top: clamp(32px, 5vw, 64px)">
      <div class="container">
        <div class="section-head">
          <span class="eyebrow">GALLERY</span>
          <h1>갤러리</h1>
          <p>우리동네사진관 울산성남점에서 촬영한 사진입니다. 사진을 누르면 크게 볼 수 있어요.</p>
        </div>
        <div class="filters" data-filters="#gallery-all" role="group" aria-label="사진 분류">
          <button type="button" data-type="all" aria-pressed="true">전체</button>
          <button type="button" data-type="family" aria-pressed="false">가족사진</button>
          <button type="button" data-type="idphoto" aria-pressed="false">증명·여권사진</button>
          <button type="button" data-type="profile" aria-pressed="false">프로필사진</button>
        </div>
        <div class="gallery" id="gallery-all" data-gallery="all"></div>
      </div>
    </section>

    <section class="section cta-band">
      <div class="container">
        <h2>마음에 드는 사진이 있으신가요?</h2>
        <p>같은 분위기로 찍고 싶다고 말씀만 해주세요. 그대로 준비해 드립니다.</p>
        <div class="btn-row">
          <a class="btn solid" data-link="booking" href="#">네이버로 예약하기</a>
          <a class="btn" data-link="kakao" href="#">카톡 문의</a>
          <a class="btn" data-link="tel" href="#">전화 걸기</a>
        </div>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>

  <script src="js/info.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
