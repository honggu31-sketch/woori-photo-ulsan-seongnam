<!DOCTYPE html>
<html lang="ko">
<head>

<body data-page="price">
  <header id="site-header"></header>

  <main>
    <section class="section" style="padding-top: clamp(32px, 5vw, 64px)">

        </div>
        <nav class="price-tabs" data-price-tabs aria-label="가격 분류"></nav>
        <div data-prices-all></div>
      </div>

    <section class="section cta-band">

        <div class="btn-row">
          <a class="btn solid" data-link="booking" href="#">네이버로 예약하기</a>
          <a class="btn" data-link="kakao" href="#">카톡 문의</a>
          <a class="btn" data-link="tel" href="#">전화 걸기</a>
        </div>
      </div>
    </section>

  <footer id="site-footer"></footer>
